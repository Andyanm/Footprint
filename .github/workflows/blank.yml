name: Build Signed APK (No Wrapper)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java（Android 官方推荐）
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. 安装稳定版 Gradle（绕过 wrapper）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # 4. 生成临时 keystore（CI 自用）
      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias auto \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore auto.keystore \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=Auto, OU=CI, O=CI, L=CI, S=CI, C=CN"

      # 5. 构建 Release APK（已签名）
      - name: Build Release APK
        env:
          ANDROID_KEYSTORE: ${{ github.workspace }}/auto.keystore
          ANDROID_KEYSTORE_PASSWORD: 123456
          ANDROID_KEY_ALIAS: auto
          ANDROID_KEY_PASSWORD: 123456
        run: |
          gradle assembleRelease

      # 6. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: app/build/outputs/apk/release/*.apk
